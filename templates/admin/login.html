<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم — جمعية المجد الشبابية</title>
<style>
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:swap;src:url(/static/fonts/cairo-arabic.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:swap;src:url(/static/fonts/cairo-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
:root{--brand:#5B4EA2;--brand-deep:#473C85;--coral:#E95A5A;--ink:#33323E;--ink-2:#5F5E70;--line:#E3E3EE;--ground:#F6F6FA}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:linear-gradient(160deg,var(--brand),var(--brand-deep));min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:40px 34px;width:min(400px,100%);box-shadow:0 30px 70px -20px rgba(30,25,60,.45);text-align:center}
.card img{width:74px;margin-bottom:14px}
h1{font-size:1.15rem;color:var(--ink);margin:0 0 4px}
p.sub{color:var(--ink-2);font-size:.82rem;margin:0 0 26px}
input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-family:inherit;font-size:.95rem;text-align:right;margin-bottom:14px;background:var(--ground)}
input:focus{outline:none;border-color:var(--brand)}
button{width:100%;border:none;border-radius:12px;padding:13px;background:var(--brand);color:#fff;font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;transition:.2s}
button:hover{background:var(--brand-deep)}
.flash{background:#FDECEC;color:#B83232;border:1px solid #F5C6C6;border-radius:10px;padding:9px 14px;font-size:.8rem;font-weight:700;margin-bottom:14px}
a.back{display:inline-block;margin-top:18px;color:var(--ink-2);font-size:.8rem;text-decoration:none}
a.back:hover{color:var(--brand)}
</style>
</head>
<body>
<div class="card">
  <img src="/static/img/logo-icon.png" alt="">
  <h1>لوحة تحكم الجمعية</h1>
  <p class="sub">إدارة وثائق الحوكمة والشفافية</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <input type="password" name="password" placeholder="كلمة المرور" autofocus required>
    <button type="submit">تسجيل الدخول</button>
  </form>
  <a class="back" href="{{ url_for('index') }}">← العودة للموقع</a>
</div>
</body>
</html>
